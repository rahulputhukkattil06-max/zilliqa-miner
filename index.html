 <!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zilliqa Mining Demo</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body{
    background:#0f172a;
    color:white;
    font-family:Arial,sans-serif;
    padding:20px;
}
.card{
    background:#1e293b;
    padding:20px;
    border-radius:15px;
    margin-bottom:15px;
}
button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    margin-top:10px;
    font-size:16px;
}
.mine{background:#0ea5e9;color:white;}
.invite{background:#22c55e;color:white;}
</style>
</head>
<body>

<div class="card">
    <h2 id="username">Loading User...</h2>
    <p>ID: <span id="userid">---</span></p>
</div>

<div class="card">
    <h3>Balance</h3>
    <h1><span id="balance">0</span> ZIL</h1>
</div>

<div class="card">
    <button class="mine" onclick="startMining()">Start Mining</button>
    <p id="status">Ready</p>
</div>

<div class="card">
    <h3>Referral</h3>
    <p id="ref">Loading...</p>
    <button class="invite" onclick="copyRef()">Copy Referral Link</button>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

let user = tg.initDataUnsafe?.user;

if(user){
    document.getElementById("username").innerText =
        user.first_name || "Telegram User";

    document.getElementById("userid").innerText =
        user.id;

    document.getElementById("ref").innerText =
        "https://t.me/YOUR_BOT_USERNAME?start=" + user.id;
}

let balance = 0;
let mining = false;

function startMining(){
    if(mining){
        alert("Mining already active");
        return;
    }

    mining = true;
    document.getElementById("status").innerText =
        "Mining started (demo)";

    setTimeout(()=>{
        balance += 60;
        document.getElementById("balance").innerText = balance;
        document.getElementById("status").innerText =
            "Mining completed";
        mining = false;
    },10000); // 10 seconds demo
}

function copyRef(){
    navigator.clipboard.writeText(
        document.getElementById("ref").innerText
    );
    alert("Copied");
}
</script>

</body>
</html>
