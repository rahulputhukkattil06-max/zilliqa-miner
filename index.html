<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZILLIQA MINING</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0d0718;
background:linear-gradient(180deg,#0d0718,#180a2f,#090909);
color:white;
min-height:100vh;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px;
}

.logo{
font-size:24px;
font-weight:bold;
color:#b26cff;
}

.menu{
font-size:28px;
cursor:pointer;
}

.card{
width:90%;
max-width:450px;
margin:20px auto;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,0.1);
border-radius:20px;
padding:25px;
text-align:center;
}

.uid{
color:#c9a3ff;
margin-bottom:10px;
}

.balance{
font-size:40px;
font-weight:bold;
margin:15px 0;
color:#d7b4ff;
}

.timer{
font-size:22px;
margin:15px 0;
}

.btn{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#8a2eff;
color:white;
font-size:18px;
cursor:pointer;
margin-top:10px;
}

.taskbox{
margin-top:20px;
text-align:left;
}

.task{
padding:12px;
background:rgba(255,255,255,0.05);
margin-top:10px;
border-radius:12px;
}

a{
color:#b26cff;
text-decoration:none;
}

.hidden{
display:none;
}
</style>
</head>

<body>

<div class="topbar">
<div class="logo">ZILLIQA MINING</div>
<div class="menu" onclick="toggleMenu()">⋮</div>
</div>

<div id="menuPanel" class="card hidden">
<h3>Tasks</h3>

<div class="task">
Official Channel<br>
<a href="https://t.me/zilliqaminning" target="_blank">
Join Channel
</a>
</div>

<div class="task">
Community Chat<br>
<a href="https://t.me/zilliqaglobalchat" target="_blank">
Join Group
</a>
</div>

<div class="task">
Referral Bonus UI Example
</div>
</div>

<div class="card">

<div class="uid" id="uid"></div>

<h2>Welcome</h2>

<div class="balance" id="balance">
1000 ZIL
</div>

<div class="timer" id="timer">
24:00:00
</div>

<button class="btn" onclick="startMining()">
START MINING
</button>

</div>

<script>

let uid=localStorage.getItem("uid");

if(!uid){
uid="UID"+Math.floor(Math.random()*999999);
localStorage.setItem("uid",uid);
}

document.getElementById("uid").innerText=uid;

let balance=parseFloat(localStorage.getItem("balance")||1000);
document.getElementById("balance").innerText=
balance.toFixed(0)+" ZIL";

function toggleMenu(){
document.getElementById("menuPanel")
.classList.toggle("hidden");
}

let endTime=localStorage.getItem("endTime");

function startMining(){

if(endTime){
return;
}

endTime=Date.now()+24*60*60*1000;

localStorage.setItem("endTime",endTime);

}

setInterval(()=>{

endTime=localStorage.getItem("endTime");

if(!endTime){
return;
}

let diff=endTime-Date.now();

if(diff<=0){

balance+=240;
localStorage.setItem("balance",balance);

document.getElementById("balance")
.innerText=balance.toFixed(0)+" ZIL";

localStorage.removeItem("endTime");

document.getElementById("timer")
.innerText="Completed";

return;
}

let h=Math.floor(diff/3600000);
let m=Math.floor((diff%3600000)/60000);
let s=Math.floor((diff%60000)/1000);

document.getElementById("timer").innerText=
String(h).padStart(2,"0")+":"+
String(m).padStart(2,"0")+":"+
String(s).padStart(2,"0");

},1000);

</script>

</body>
</html>
