<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ZILLIQA MINING</title>

<style>
:root{
--bg:#08080f;
--card:#13131f;
--violet:#8b5cf6;
--violet2:#a855f7;
--text:#fff;
--muted:#b5b5d3;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#05050b,#120f25,#1b1236);
color:white;
padding:20px;
}

.container{
max-width:700px;
margin:auto;
}

.card{
background:rgba(19,19,31,.95);
border:1px solid rgba(139,92,246,.3);
border-radius:24px;
padding:20px;
margin-bottom:18px;
box-shadow:0 0 25px rgba(139,92,246,.15);
}

.logo{
text-align:center;
font-size:32px;
font-weight:800;
color:#a855f7;
margin-bottom:10px;
}

.subtitle{
text-align:center;
color:#b8b8d4;
margin-bottom:20px;
}

.uid{
display:flex;
justify-content:space-between;
margin-bottom:10px;
}

.balance{
font-size:48px;
font-weight:800;
text-align:center;
color:#a855f7;
margin:20px 0;
}

.timer{
font-size:34px;
font-weight:700;
text-align:center;
margin-bottom:15px;
}

button{
width:100%;
padding:16px;
border:none;
border-radius:16px;
cursor:pointer;
font-size:18px;
font-weight:700;
margin-top:10px;
}

.mine{
background:linear-gradient(90deg,#8b5cf6,#a855f7);
color:white;
}

.secondary{
background:#1d1d33;
color:white;
border:1px solid #8b5cf6;
}

input{
width:100%;
padding:14px;
border-radius:14px;
border:1px solid #444;
background:#10101a;
color:white;
margin-top:10px;
}

.section-title{
font-size:20px;
margin-bottom:10px;
}

.link{
display:block;
text-decoration:none;
background:#1d1d33;
padding:14px;
border-radius:14px;
color:white;
margin-top:10px;
}

.small{
color:#b5b5d3;
font-size:14px;
}
</style>
</head>
<body>

<div class="container">

<div class="card">
<div class="logo">ZILLIQA MINING</div>
<div class="subtitle">@ZilRewardsMiner_bot</div>

<div class="uid">
<span>User ID</span>
<span id="uid"></span>
</div>
</div>

<div class="card">
<div class="balance" id="balance">0.000 ZIL</div>

<div class="timer" id="timer">06:00:00</div>

<button class="mine" onclick="startMining()">START MINING</button>
</div>

<div class="card">
<div class="section-title">Wallet</div>

<input id="wallet" placeholder="Enter Zilliqa wallet address">

<button class="secondary" onclick="saveWallet()">
Save Address
</button>

<p class="small" id="walletDisplay">
No address saved
</p>
</div>

<div class="card">
<div class="section-title">Invite Friends</div>

<p>Reward Example: 200 ZIL per referral</p>

<input id="refLink" readonly>

<button class="secondary" onclick="copyLink()">
Copy Invite Link
</button>
</div>

<div class="card">
<div class="section-title">Tasks</div>

<a class="link" href="https://t.me/zilliqaminning" target="_blank">
Official Channel
</a>

<a class="link" href="https://t.me/zilliqaglobalchat" target="_blank">
Global Chat
</a>
</div>

</div>

<script>
const uid =
localStorage.getItem("uid") ||
Math.floor(100000000 + Math.random()*900000000);

localStorage.setItem("uid",uid);

document.getElementById("uid").innerText=uid;
document.getElementById("refLink").value=
location.origin+"?ref="+uid;

let balance=
parseFloat(localStorage.getItem("balance")||0);

updateBalance();

let miningEnd=
parseInt(localStorage.getItem("miningEnd")||0);

function updateBalance(){
document.getElementById("balance").innerText=
balance.toFixed(3)+" ZIL";
}

function startMining(){
const now=Date.now();

if(miningEnd>now){
alert("Mining already active");
return;
}

miningEnd=now+(6*60*60*1000);

localStorage.setItem("miningEnd",miningEnd);

alert("Mining started for 6 hours");
}

function tick(){
const now=Date.now();

if(miningEnd>now){

let diff=miningEnd-now;

let h=Math.floor(diff/3600000);
let m=Math.floor((diff%3600000)/60000);
let s=Math.floor((diff%60000)/1000);

document.getElementById("timer").innerText=
String(h).padStart(2,"0")+":"+
String(m).padStart(2,"0")+":"+
String(s).padStart(2,"0");

}else{

if(miningEnd!==0){

balance+=60;

localStorage.setItem("balance",balance);

updateBalance();

miningEnd=0;

localStorage.setItem("miningEnd",0);
}

document.getElementById("timer").innerText=
"00:00:00";
}
}

function saveWallet(){
const wallet=
document.getElementById("wallet").value.trim();

localStorage.setItem("wallet",wallet);

document.getElementById("walletDisplay").innerText=
wallet||"No address saved";
}

function copyLink(){
navigator.clipboard.writeText(
document.getElementById("refLink").value
);
alert("Copied");
}

const savedWallet=
localStorage.getItem("wallet");

if(savedWallet){
document.getElementById("walletDisplay").innerText=
savedWallet;
}

setInterval(tick,1000);
tick();
</script>

</body>
</html>
