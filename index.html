<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZILLIQA MINING</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#05030c;
color:white;
}

header{
background:linear-gradient(90deg,#7b2cff,#160028);
padding:18px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:28px;
font-weight:bold;
}

.uid{
background:#12081d;
padding:10px 15px;
border-radius:12px;
}

.container{
max-width:500px;
margin:auto;
padding:20px;
padding-bottom:100px;
}

.card{
background:#0d0918;
border:1px solid #2a1f40;
border-radius:20px;
padding:20px;
margin-bottom:20px;
}

.balance{
font-size:40px;
font-weight:bold;
text-align:center;
color:#bb86fc;
margin-top:10px;
}

.coin{
width:220px;
height:220px;
margin:25px auto;
border-radius:50%;
background:radial-gradient(circle,#9f6bff,#5b22d4,#24004f);
display:flex;
align-items:center;
justify-content:center;
font-size:90px;
cursor:pointer;
box-shadow:0 0 30px #8d4fff;
border:5px solid #ffd700;
}

.coin:active{
transform:scale(.95);
}

.center{
text-align:center;
}

input{
width:100%;
padding:14px;
background:#161022;
border:none;
border-radius:12px;
color:white;
margin-top:10px;
}

button{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:12px;
background:#7b2cff;
color:white;
font-weight:bold;
cursor:pointer;
}

.nav{
position:fixed;
bottom:0;
left:0;
right:0;
background:#0d0918;
display:flex;
justify-content:space-around;
padding:15px;
}

.nav button{
width:auto;
background:none;
}

.page{
display:none;
}

.active{
display:block;
}
</style>
</head>

<body>

<header>
<div class="logo">ZILLIQA MINING</div>
<div class="uid" id="uid"></div>
</header>

<div class="container">

<div id="home" class="page active">

<div class="card">

<div class="balance" id="tapCount">0</div>

<div class="coin" onclick="tapCoin()">
⚡
</div>

<div class="center">
Tap Counter
</div>

</div>

<div class="card">
<h3>24 Hour Timer</h3>
<h2 id="timer">24:00:00</h2>
</div>

</div>

<div id="tasks" class="page">

<div class="card">
<h3>Tasks</h3>

<a href="https://t.me/zilliqaminning" target="_blank">
<button>Official Channel</button>
</a>

<a href="https://t.me/zilliqaglobalchat" target="_blank">
<button>Global Chat</button>
</a>

</div>

</div>

<div id="refer" class="page">

<div class="card">
<h3>Referral</h3>

<p>Your UID:</p>
<h2 id="refuid"></h2>

<input id="reflink" readonly>

<button onclick="copyRef()">
Copy Link
</button>

</div>

</div>

<div id="profile" class="page">

<div class="card">

<h3>Wallet</h3>

<input
id="wallet"
placeholder="Enter wallet address">

<button onclick="saveWallet()">
Save Wallet
</button>

<p id="saved"></p>

</div>

</div>

</div>

<div class="nav">
<button onclick="show('home')">Home</button>
<button onclick="show('tasks')">Tasks</button>
<button onclick="show('refer')">Refer</button>
<button onclick="show('profile')">Profile</button>
</div>

<script>

let uid = localStorage.getItem("uid");

if(!uid){
uid = Math.floor(Math.random()*999999999);
localStorage.setItem("uid",uid);
}

document.getElementById("uid").innerText=uid;
document.getElementById("refuid").innerText=uid;

document.getElementById("reflink").value=
location.href+"?ref="+uid;

let taps=parseInt(localStorage.getItem("taps")||0);

document.getElementById("tapCount").innerText=taps;

function tapCoin(){

taps++;

localStorage.setItem("taps",taps);

document.getElementById("tapCount").innerText=taps;
}

function saveWallet(){

let w=document.getElementById("wallet").value;

localStorage.setItem("wallet",w);

document.getElementById("saved").innerHTML=
"✅ Wallet Saved";
}

function copyRef(){

navigator.clipboard.writeText(
document.getElementById("reflink").value
);

alert("Copied");
}

function show(id){

document.querySelectorAll(".page")
.forEach(x=>x.classList.remove("active"));

document.getElementById(id)
.classList.add("active");
}

let end=localStorage.getItem("timerEnd");

if(!end){

end=Date.now()+86400000;

localStorage.setItem("timerEnd",end);
}

setInterval(()=>{

let left=end-Date.now();

if(left<=0){

end=Date.now()+86400000;

localStorage.setItem("timerEnd",end);

left=86400000;
}

let h=Math.floor(left/3600000);
let m=Math.floor((left%3600000)/60000);
let s=Math.floor((left%60000)/1000);

document.getElementById("timer").innerHTML=
String(h).padStart(2,'0')+
":"+
String(m).padStart(2,'0')+
":"+
String(s).padStart(2,'0');

},1000);

</script>

</body>
</html>
